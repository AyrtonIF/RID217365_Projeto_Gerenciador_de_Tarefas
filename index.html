<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de tarefas - Projeto Final Javascript DNC</title>
    <link rel="stylesheet" href="style.css">
    <script src="./index.js"></script>
</head>
<body>
    <main>
        <h1>Board de tarefas</h1>
        <section id="create-todo-section">
            <form id="creat-todo-form">
                <input 
                    type="text" 
                    id="description" 
                    name="description"
                    class="input-description"
                    aria-label="Nome da tarefa"
                    placeholder="Nome da tarefa"
                    required
                >
                <input 
                    type="text" 
                    id="label" 
                    name="label"
                    class="input-description"
                    aria-label="Etiqueta"
                    placeholder="Etiqueta"
                    required
                >
                <button type="submit" id="save-task" aria-label="Cadastrar tarefa" class="add-task-btn">+</button>
            </form>
        </section>

        <section class="todo-list-section">
            <ul id="todo-list"></ul>
        </section>
        
        <footer id="todo-footer"></footer>
    </main>
</body>
</html>
